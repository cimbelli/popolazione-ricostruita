name: Aggiorna Serie Storica Comuni 2002-2026

on:
  schedule:
    - cron: '0 4 1 * *' # Ogni 1° del mese alle 04:00 UTC
  workflow_dispatch:     # Avvio manuale con un clic

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install pandas requests opensituas

      - name: Scarica dati Istat/SITUAS e ricostruisci la serie
        # Se lo script fallisce (es. URL o formati Istat cambiati) l'Action diventa rossa
        # e i dati pubblicati NON vengono sovrascritti. Per forzare l'URL del file comuni
        # della ricostruzione 2002-2019 imposta la variabile di repository RIC_URL.
        env:
          RIC_URL: ${{ vars.RIC_URL }}
        run: python scripts/build_series.py

      - name: Salva e pubblica i nuovi dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/popolazione_2026.json data/popolazione_2026.csv api/
          git commit -m "Aggiornamento automatico serie storica $(date +'%Y-%m-%d')" || exit 0
          git push
